---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: {{ .Chart.Name | quote }}
  namespace: {{ .Values.global.licensePlate }}{{ .Values.global.sectionTag }}
  labels:
{{ include "nginx.labels.standard" . | indent 4 }}
    app.openshift.io/runtime: {{ .Values.labels.runtime }}
    app.openshift.io/runtime-version: {{ .Values.labels.version | quote }}
    app.openshift.io/runtime-namespace: {{ .Values.global.licensePlate }}{{ .Values.global.sectionTag }}
  annotations:
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name | quote }}
  template:
    metadata:
      labels: 
        app.kubernetes.io/name: {{ .Chart.Name | quote }}
    spec:
      volumes:
        {{- range $volume := .Values.volumes }}
        - name: {{ required "Volume name is required" $volume.name }}
          {{- if eq $volume.type "persistentVolumeClaim" }}
          persistentVolumeClaim:
            claimName: {{ default $volume.name $volume.claimName }}
            {{- if $volume.readOnly }}
            readOnly: {{ $volume.readOnly }}
            {{- end }}
          {{- else if eq $volume.type "configMap" }}
          configMap:
            name: {{ default $volume.name $volume.configMapName }}
          {{- else }}
          {{- fail (printf "Unsupported nginx volume type %q for volume %q" $volume.type $volume.name) }}
          {{- end }}
        {{- end }}
      containers:
        - name: {{ .Chart.Name | quote }}
          image: "{{ default .Values.global.image.repository .Values.image.repository }}/{{ default .Chart.Name .Values.image.name }}:{{ default .Values.global.image.tag .Values.image.tag }}"
          ports:
            - name: {{ .Values.ports.name }}
              containerPort: {{ .Values.ports.containerPort }}
              protocol: {{ .Values.ports.protocol }}
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              memory: {{ .Values.resources.limits.memory }}
          volumeMounts:
            {{- range $volume := .Values.volumes }}
            - mountPath: {{ required (printf "mountPath is required for volume %s" $volume.name) $volume.mountPath | quote }}
              name: {{ $volume.name }}
              {{- if $volume.subPath }}
              subPath: {{ $volume.subPath | quote }}
              {{- end }}
              {{- if $volume.readOnly }}
              readOnly: {{ $volume.readOnly }}
              {{- end }}
            {{- end }}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: Always
          readinessProbe: 
            tcpSocket:
              port: {{ .Values.ports.containerPort }}
            timeoutSeconds: 1
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          livenessProbe: 
            tcpSocket:
              port: {{ .Values.ports.containerPort }}
            initialDelaySeconds: 15
            timeoutSeconds: 1
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      schedulerName: default-scheduler
  strategy:
    type: RollingUpdate
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
...
