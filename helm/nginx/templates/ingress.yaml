{{- $ingress := .Values.ingress | default dict }}
{{- if $ingress.url }}
{{- $tls := $ingress.tls | default dict }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Chart.Name | quote }}
  namespace: {{ .Values.global.licensePlate }}{{ .Values.global.sectionTag }}
  labels:
{{ include "nginx.labels.standard" . | indent 4 }}
spec:
  ingressClassName: openshift-default
  {{- if $tls.enabled }}
  tls:
    - hosts:
        - {{ $ingress.url | quote }}
      secretName: {{ required "limesurvey-nginx.ingress.tls.secret is required when ingress.tls.enabled is true" $tls.secret | quote }}
  {{- end }}
  rules:
    - host: {{ $ingress.url | quote }}
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ .Chart.Name | quote }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
