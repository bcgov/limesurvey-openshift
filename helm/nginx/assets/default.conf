client_body_temp_path /tmp/client_temp;
proxy_temp_path       /tmp/proxy_temp;
fastcgi_temp_path     /tmp/fastcgi_temp;
uwsgi_temp_path       /tmp/uwsgi_temp;
scgi_temp_path        /tmp/scgi_temp;

gzip on;
gzip_vary on; 
gzip_min_length 1024; 
gzip_proxied any; 
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml font/woff2;

# Trust OpenShift Router IP range
set_real_ip_from 10.0.0.0/8; 
real_ip_header X-Forwarded-For;

server {
    listen 8080 default_server;
    server_name nginx;
    
    client_max_body_size 64M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff";
    add_header X-Robots-Tag "noindex";
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";

    location / {
        # Redirect everything that is not a real file to index.php
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # Redirect server error pages to the static page /50x.html
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html/;
    }
    
    # Pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
    location /nginx_status {
        stub_status on;
        access_log off;
        log_not_found off;
        allow 127.0.0.1;
        deny all;
    }

    location ~ ^/(admin|dashboard) {
        allow 142.34.53.0/24;
        allow 142.22.0.0/15;
        allow 142.24.0.0/13;
        allow 142.32.0.0/13;
        allow 127.0.0.1;
        deny all; 

        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        try_files $fastcgi_script_name =404;
        root /var/www/html/limesurvey;
        
        fastcgi_pass    limesurvey-php:9000;
        fastcgi_index   index.php;
        fastcgi_param   SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param   QUERY_STRING  $query_string;
        include         /etc/nginx/fastcgi_params;

        fastcgi_read_timeout 60s;
        fastcgi_send_timeout 60s;

        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_busy_buffers_size 64k;
    }

    location ^~ /healthz {
        access_log off;
        allow 127.0.0.1;
        deny all;
        add_header 'Content-Type' 'text/plain';
        return 200 "healthy\n";
    }

    location ^~ /upload/ {
        location ~ \.php$ {
            deny all;
        }
    }    
    location ~* /(cache|application/config)/.*\.php$ {
        deny all;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|json|svg|ttf|woff|woff2)$ {
        root /var/www/html/limesurvey;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
        gzip_static on;
    }
    location ~* /editor/ {
        root /var/www/html/limesurvey;
        try_files $uri $uri/ =404;
    }
}
