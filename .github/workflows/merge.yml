name: Deploy to Dev - PR Merge
run-name: "Deploy to DEV - PR Merge - ${{ github.event.head_commit.message }}"

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '.github/**'
      - '!.github/workflows/**'

concurrency:
  # Do not interrupt previous workflows
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

jobs:
  vars:
    name: Set Variables
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      # Get PR number for squash merges to main
      - name: Get PR Number From Event
        if: github.event_name == 'push'
        id: pr_no
        uses: bcgov/action-get-pr@28b0adf8e4d40720d41f9c87356ce24b0a4bd6af #v0.3.1
      - name: PR Number
        id: pr
        run: echo pr=${{ steps.pr_no.outputs.pr }} >> $GITHUB_OUTPUT

  deploy-dev:
    name: Deploy (DEV)
    uses: ./.github/workflows/helm-cd.yml
    secrets: inherit
    needs: [vars]
    permissions:
      contents: read
      packages: write
    with:
      environment: dev
      tag: pr-${{ needs.vars.outputs.pr }}

  tag-sha:
    name: Tag Images with Commit SHA
    needs: [vars, deploy-dev]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    strategy:
      matrix:
        package: [php, nginx]
    steps:
      - id: sha
        run: echo "short=sha-${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT
      - uses: shrink/actions-docker-registry-tag@e6aaef25c595b6e0edd18bf4c7dbfea3abd43299 # v5
        with:
          registry: ghcr.io
          repository: ${{ github.repository }}/limesurvey-${{ matrix.package }}
          target: pr-${{ needs.vars.outputs.pr }}
          tags: ${{ steps.sha.outputs.short }}
