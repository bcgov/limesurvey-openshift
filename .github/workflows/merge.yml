name: Build Main Images
run-name: "Build main-${{ github.sha }}"

on:
  push:
    branches: [main]

jobs:
  builds:
    name: Build (${{ matrix.package }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        package: [php, nginx]
    timeout-minutes: 10
    steps:
      - name: Set image tag
        id: tag
        run: echo "value=main-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.package }}
          file: ./${{ matrix.package }}/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/limesurvey-${{ matrix.package }}:${{ steps.tag.outputs.value }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/limesurvey-${{ matrix.package }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/limesurvey-${{ matrix.package }}:buildcache,mode=max
