name: Deploy to Dev - PR Merge
run-name: "Deploy to DEV - PR Merge - ${{ github.event.head_commit.message }}"

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '.github/**'
      - '!.github/workflows/**'

concurrency:
  # Do not interrupt previous workflows
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

jobs:
  vars:
    name: Set Variables
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      # Get PR number for squash merges to main
      - name: Get PR Number From Event
        if: github.event_name == 'push'
        id: pr_no
        uses: bcgov/action-get-pr@bf6c85d0ed23a151f2829956c140fde87979bbf2 #v0.2.0
      - name: PR Number
        id: pr
        run: echo pr=${{ steps.pr_no.outputs.pr || inputs.pr}} >> $GITHUB_OUTPUT

  deploy-dev:
    name: Deploy (DEV)
    uses: ./.github/workflows/helm-cd.yml
    secrets: inherit
    needs: [vars]
    permissions:
      contents: read
      packages: write
    with:
      environment: dev
      tag: ${{ needs.vars.outputs.pr }}
