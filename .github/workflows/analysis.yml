name: Scan & Validate
run-name: "Analysis (PR #${{ github.event.pull_request.number || github.run_number }})"

on:
  merge_group:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
#  schedule:
#    - cron: "0 11 * * 0" # 3 AM PST = 12 PM UDT, runs sundays
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helm-validate:
    runs-on: ubuntu-24.04
    name: Validate Helm Templates
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v6
      - name: Update & Build Helm dependencies
        run: |
          helm dependency build helm
          helm dependency update helm
      - name: Validate Helm Chart
        run: |
          helm lint ./helm --values helm/values.yaml --values helm/values-dev.yaml
          helm lint ./helm --values helm/values.yaml --values helm/values-test.yaml
          helm lint ./helm --values helm/values.yaml --values helm/values-prod.yaml
          mkdir ~/rendered-templates
          helm template --debug ./helm --values helm/values.yaml --values helm/values-dev.yaml --output-dir ~/rendered-templates/dev
          helm template --debug ./helm --values helm/values.yaml --values helm/values-test.yaml --output-dir ~/rendered-templates/test
          helm template --debug ./helm --values helm/values.yaml --values helm/values-prod.yaml --output-dir ~/rendered-templates/prod

  codeql:
    name: CodeQL
    if: (! github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v6
      - uses: github/codeql-action/init@v4
        with:
          languages: actions
    
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:actions"

  # https://github.com/marketplace/actions/aqua-security-trivy
  trivy:
    name: Trivy Security Scan
    if: (! github.event.pull_request.draft)
    permissions:
      security-events: write
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v6
      - name: Update & Build Helm dependencies
        run: |
          helm dependency build helm
          helm dependency update helm
      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          format: "sarif"
          output: "trivy-results.sarif"
          ignore-unfixed: true
          scan-type: "fs"
          scanners: "vuln,secret,misconfig"
          severity: "CRITICAL,HIGH"
#          skip-dirs: '**/charts' # Skips all subchart directories

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-results.sarif"

  results:
    name: Results
    needs: [helm-validate, codeql, trivy]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Check Results
        run: |
          set -euo pipefail

          if [ "${{ needs.helm-validate.result }}" != "success" ]; then
            echo "Helm validation failed: ${{ needs.helm-validate.result }}"
            exit 1
          fi

          for result in "${{ needs.codeql.result }}" "${{ needs.trivy.result }}"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "Analysis failed: $result"
              exit 1
            fi
          done

          echo "Success!"
