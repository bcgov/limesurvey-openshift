name: Deploy to OpenShift
run-name: "Helm Deploy (${{ inputs.environment || github.event.inputs.environment || 'dev' }})"

on:
  workflow_call:
    inputs:
      tag:
        description: "Specify a tag to deploy; defaults to PR number"
        required: false
        type: string
      environment:
        description: "Target environment to deploy"
        required: false
        default: "dev"
        type: string
    secrets:
      OPENSHIFT_SERVER:
        required: true
      OPENSHIFT_SA_TOKEN:
        required: true
      OPENSHIFT_NAMESPACE:
        required: true

  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to deploy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - test
          - prod
      tag:
        description: Specify a tag to deploy
        required: false
        type: string

concurrency:
  # Serialize deploys per environment (do not cancel in-flight deploys)
  group: deploy-${{ inputs.environment || github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false


jobs:
  helm-deploy:
    environment: ${{ inputs.environment || github.event.inputs.environment || 'dev' }}
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
       # Variables
      - if: ${{ ! inputs.tag }}
        id: pr
        uses: bcgov/action-get-pr@28b0adf8e4d40720d41f9c87356ce24b0a4bd6af # v0.3.1
      - id: vars
        run: |
          # Tag defaults to explicitly provided input, then PR number, then the branch name
          PR=${{ steps.pr.outputs.pr }}
          if [ -n "$PR" ]; then
             PR_TAG="pr-$PR"
          else
             PR_TAG=""
          fi
          
          tag=${{ inputs.tag || github.event.inputs.tag }}
          tag=${tag:-$PR_TAG}
          tag=${tag:-${{ github.ref_name }}}

          # Output
          echo "tag=${tag}" >> $GITHUB_OUTPUT
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Set up OpenShift CLI
        uses: redhat-actions/openshift-tools-installer@ebd96c3fc72fc10a62663eac5e1421192152e6aa # v2.0
        with:
          oc: "4.16"
          skip_cache: true
      - name: Login to OpenShift
        env:
          OPENSHIFT_SERVER: ${{ secrets.OPENSHIFT_SERVER }}
          OPENSHIFT_SA_TOKEN: ${{ secrets.OPENSHIFT_SA_TOKEN }}
        run: |
          for i in {1..5}; do
            # Server sometimes doesn't respond immediately, retry a few times
            oc login --server=$OPENSHIFT_SERVER --token=$OPENSHIFT_SA_TOKEN && break
            echo "Login failed, retrying in 5 seconds... ($i/5)"
            sleep 5
          done
      - name: Set OpenShift project
        run: |
          oc project ${{ secrets.OPENSHIFT_NAMESPACE }}
      - name: Update & Build Helm dependencies
        run: |
          helm dependency update ./helm
          helm dependency build ./helm
      - name: Preflight Helm Check
        run: |
          helm lint ./helm \
            --values ./helm/values.yaml \
            --values ./helm/values-${{ inputs.environment || github.event.inputs.environment || 'dev' }}.yaml
          helm template limesurvey ./helm \
            --values ./helm/values.yaml \
            --values ./helm/values-${{ inputs.environment || github.event.inputs.environment || 'dev' }}.yaml \
            --set-string global.image.tag="${{ steps.vars.outputs.tag }}" > /dev/null
      - name: Deploy Helm chart
        run: |
          helm upgrade --namespace ${{ secrets.OPENSHIFT_NAMESPACE }} --install limesurvey ./helm \
            --values ./helm/values.yaml \
            --values ./helm/values-${{ inputs.environment || github.event.inputs.environment || 'dev' }}.yaml \
            --set-string global.image.tag="${{ steps.vars.outputs.tag }}"
      - name: Verify Deployment
        run: |
          oc rollout --namespace ${{ secrets.OPENSHIFT_NAMESPACE }} status deployment/limesurvey-nginx --timeout=180s
          oc rollout --namespace ${{ secrets.OPENSHIFT_NAMESPACE }} status deployment/limesurvey-php --timeout=180s

  promote-images:
    name: Promote Images
    needs: [helm-deploy]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    strategy:
      matrix:
        package: [php, nginx]
    timeout-minutes: 2
    steps:
      - uses: shrink/actions-docker-registry-tag@v5
        with:
          registry: ghcr.io
          repository: ${{ github.repository }}/limesurvey-${{ matrix.package }}
          target: ${{ needs.helm-deploy.outputs.tag }}
          tags: ${{ inputs.environment || github.event.inputs.environment || 'dev' }}  # Promote images AFTER successful deploy
