name: Deploy to OpenShift
run-name: "Deploy ${{ github.ref_name }} to ${{ inputs.environment }}"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to deploy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - tst
          - prod

concurrency:
  # Serialize deploys per environment (do not cancel in-flight deploys)
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false


jobs:
  helm-deploy:
    environment: ${{ inputs.environment == 'tst' && 'test' || inputs.environment }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check image tags
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            echo "Select a release tag in 'Use workflow from'." >&2
            exit 1
          fi
          if [[ ! "$TAG" =~ ^(pr-[0-9]+|main-[0-9a-f]{7}|v[0-9]+\.[0-9]+\.[0-9]+-[0-9a-f]{7})$ ]]; then
            echo "Unsupported image tag: $TAG" >&2
            exit 1
          fi
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for package in php nginx; do
            docker buildx imagetools inspect "ghcr.io/${{ github.repository }}/limesurvey-$package:$TAG" >/dev/null
          done
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up OpenShift CLI
        uses: redhat-actions/openshift-tools-installer@37eb3cfb20ac2df6f0511ffa71cd917e4d49cabf # v3.1
        with:
          oc: "4.16"
          skip_cache: true
      - name: Login to OpenShift
        env:
          OPENSHIFT_SERVER: ${{ secrets.OPENSHIFT_SERVER }}
          OPENSHIFT_SA_TOKEN: ${{ secrets.OPENSHIFT_SA_TOKEN }}
        run: |
          for i in {1..5}; do
            # Server sometimes doesn't respond immediately, retry a few times
            oc login --server=$OPENSHIFT_SERVER --token=$OPENSHIFT_SA_TOKEN && break
            echo "Login failed, retrying in 5 seconds... ($i/5)"
            sleep 5
          done
      - name: Set OpenShift project
        run: |
          oc project ${{ secrets.OPENSHIFT_NAMESPACE }}
      - name: Update & Build Helm dependencies
        run: |
          helm dependency update ./helm
          helm dependency build ./helm
      - name: Preflight Helm Check
        env:
          VALUES_ENV: ${{ inputs.environment == 'tst' && 'test' || inputs.environment }}
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          helm lint ./helm \
            --values ./helm/values.yaml \
            --values "./helm/values-${VALUES_ENV}.yaml"
          helm template limesurvey ./helm \
            --values ./helm/values.yaml \
            --values "./helm/values-${VALUES_ENV}.yaml" \
            --set-string global.image.tag="$IMAGE_TAG" > /dev/null
      - name: Deploy Helm chart
        env:
          VALUES_ENV: ${{ inputs.environment == 'tst' && 'test' || inputs.environment }}
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          helm upgrade --namespace ${{ secrets.OPENSHIFT_NAMESPACE }} --install limesurvey ./helm \
            --wait \
            --timeout 10m \
            --values ./helm/values.yaml \
            --values "./helm/values-${VALUES_ENV}.yaml" \
            --set-string global.image.tag="$IMAGE_TAG"
      - name: Verify Deployment
        run: |
          oc rollout --namespace ${{ secrets.OPENSHIFT_NAMESPACE }} status deployment/limesurvey-nginx --timeout=180s
          oc rollout --namespace ${{ secrets.OPENSHIFT_NAMESPACE }} status deployment/limesurvey-php --timeout=180s

  publish-release:
    name: Publish production release
    needs: [helm-deploy]
    if: inputs.environment == 'prod' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Promote pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$RELEASE_TAG" --jq '.id')
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/$release_id" -F prerelease=false
