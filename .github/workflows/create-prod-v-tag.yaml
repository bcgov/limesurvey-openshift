name: Create Production v Tag
# Promote an existing rc_* tag to a v* production tag.

on:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: 'Source RC tag to promote (e.g. rc_0.1.0.5)'
        required: true
        type: string
      deploy_to_prd:
        description: 'Trigger CD deployment to PRD after tagging'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  resolve-prod:
    runs-on: ubuntu-latest
    outputs:
      target_sha: ${{ steps.resolve.outputs.target_sha }}
      prod_tag: ${{ steps.resolve.outputs.prod_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Validate inputs and resolve SHA
        id: resolve
        run: |
          set -euo pipefail

          RC_TAG="${{ inputs.rc_tag }}"

          # Validate RC tag format
          if [[ ! $RC_TAG =~ ^rc_[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: RC tag '$RC_TAG' must match format rc_x.x.x.x (e.g. rc_0.1.0.5)"
            exit 1
          fi

          # Derive production tag by replacing rc_ prefix with v
          PROD_TAG="v${RC_TAG#rc_}"

          # Verify the RC tag exists
          if ! git rev-parse "$RC_TAG" >/dev/null 2>&1; then
            echo "Error: RC tag '$RC_TAG' does not exist in the repository."
            exit 1
          fi

          if git rev-parse "$PROD_TAG" >/dev/null 2>&1; then
            echo "Error: production tag '$PROD_TAG' already exists."
            exit 1
          fi

          TARGET_SHA=$(git rev-parse "$RC_TAG^{commit}")
          SHA_SHORT="${TARGET_SHA:0:7}"

          echo "target_sha=$TARGET_SHA" >> $GITHUB_OUTPUT
          echo "sha_short=$SHA_SHORT" >> $GITHUB_OUTPUT
          echo "prod_tag=$PROD_TAG" >> $GITHUB_OUTPUT
          echo "Resolved $RC_TAG -> $TARGET_SHA (prod tag: $PROD_TAG)"

      - name: Validate RC Images
        env:
          RC_TAG: ${{ inputs.rc_tag }}
        run: |
          set -euo pipefail
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for package in php nginx; do
            docker buildx imagetools inspect "ghcr.io/${{ github.repository }}/limesurvey-$package:$RC_TAG" >/dev/null
          done

  retag-images:
    name: Retag Images
    needs: [resolve-prod]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        package: [php, nginx]
    steps:
      - uses: shrink/actions-docker-registry-tag@e6aaef25c595b6e0edd18bf4c7dbfea3abd43299 # v5
        with:
          registry: ghcr.io
          repository: ${{ github.repository }}/limesurvey-${{ matrix.package }}
          target: ${{ inputs.rc_tag }}
          tags: ${{ needs.resolve-prod.outputs.prod_tag }}

  verify-images:
    name: Verify Promoted Images
    needs: [resolve-prod, retag-images]
    runs-on: ubuntu-24.04
    permissions:
      packages: read
    strategy:
      matrix:
        package: [php, nginx]
    steps:
      - name: Verify promoted image digest
        env:
          IMAGE: ghcr.io/${{ github.repository }}/limesurvey-${{ matrix.package }}
          SOURCE_TAG: ${{ inputs.rc_tag }}
          DESTINATION_TAG: ${{ needs.resolve-prod.outputs.prod_tag }}
        run: |
          set -euo pipefail
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          source_digest=$(docker buildx imagetools inspect "$IMAGE:$SOURCE_TAG" --format '{{.Manifest.Digest}}')
          for attempt in {1..5}; do
            destination_digest=$(docker buildx imagetools inspect "$IMAGE:$DESTINATION_TAG" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
            if [ "$source_digest" = "$destination_digest" ]; then
              echo "Verified $IMAGE:$DESTINATION_TAG -> $destination_digest"
              exit 0
            fi
            echo "Digest not available or does not match yet ($attempt/5); retrying..."
            sleep 5
          done

          echo "Error: $IMAGE:$DESTINATION_TAG does not match $IMAGE:$SOURCE_TAG."
          exit 1

  create-prod-tag:
    name: Create Production Git Tag
    needs: [resolve-prod, verify-images]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
      - name: Create and push production tag
        env:
          PROD_TAG: ${{ needs.resolve-prod.outputs.prod_tag }}
          TARGET_SHA: ${{ needs.resolve-prod.outputs.target_sha }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin

          if git rev-parse --verify "refs/tags/$PROD_TAG" >/dev/null 2>&1; then
            echo "Error: production tag '$PROD_TAG' already exists."
            exit 1
          fi

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag "$PROD_TAG" "$TARGET_SHA"
          git push origin "refs/tags/$PROD_TAG"

          echo "Created and pushed tag $PROD_TAG -> $TARGET_SHA"

  deploy-prod:
    name: Deploy to Prod
    needs: [resolve-prod, create-prod-tag, retag-images, create-release]
    if: ${{ inputs.deploy_to_prd }}
    uses: ./.github/workflows/helm-cd.yml
    with:
      environment: prod
      tag: ${{ needs.resolve-prod.outputs.prod_tag }}
    secrets: inherit

  create-release:
    name: Release
    needs: [resolve-prod, create-prod-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release with Release Notes
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ needs.resolve-prod.outputs.prod_tag }}
          prerelease: false
          generate_release_notes: true
          target_commitish: ${{ needs.resolve-prod.outputs.target_sha }}