name: Create Release Branch
run-name: "Release ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.2.3)'
        required: true
        type: string
      source:
        description: 'latest or a commit SHA from main'
        required: true
        default: latest
        type: string

jobs:
  branch:
    name: Resolve release source
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Validate and create branch
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SOURCE: ${{ inputs.source }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be x.y.z (e.g. 1.2.3)." >&2
            exit 1
          fi
          if [[ "$SOURCE" == latest ]]; then
            target_sha=$(git rev-parse HEAD)
          else
            if [[ ! "$SOURCE" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
              echo "Enter latest or a 7-40 character commit SHA from main." >&2
              exit 1
            fi
            target_sha=$(git rev-parse --verify "${SOURCE}^{commit}")
            if ! git merge-base --is-ancestor "$target_sha" HEAD; then
              echo "Commit $target_sha is not in main history." >&2
              exit 1
            fi
          fi
          branch="release/v$VERSION"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/$branch" >/dev/null 2>&1; then
            echo "Branch $branch already exists." >&2
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/heads/$branch" -f "sha=$target_sha"
          gh workflow run merge.yml --ref "$branch"