name: Create Release Branch and Build Images
run-name: "Release v${{ inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.2.3); branch off main'
        required: true
        type: string

jobs:
  branch:
    name: Create release branch
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      ref: ${{ steps.create.outputs.ref }}
      tag: ${{ steps.create.outputs.tag }}
    steps:
      - name: Validate and create branch
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be x.y.z (e.g. 1.2.3)." >&2
            exit 1
          fi
          branch="release/v$VERSION"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/$branch" >/dev/null 2>&1; then
            echo "Branch $branch already exists." >&2
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/heads/$branch" -f "sha=$GITHUB_SHA"
          echo "ref=$branch" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

  builds:
    name: Build release (${{ matrix.package }})
    needs: [branch]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        package: [php, nginx]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.branch.outputs.ref }}
          persist-credentials: false
      - name: Verify release source
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.package }}
          file: ./${{ matrix.package }}/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/limesurvey-${{ matrix.package }}:${{ needs.branch.outputs.tag }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/limesurvey-${{ matrix.package }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/limesurvey-${{ matrix.package }}:buildcache,mode=max