name: Build - PR Open
run-name: "Build (PR #${{ github.event.pull_request.number }})"

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  # Cancel in progress for PR open and close, but not merge_group
  group: ${{ github.event.number }}
  cancel-in-progress: true

jobs:
  pr-description-add:
    name: PR Description Add
    if: github.event_name == 'pull_request'
    env:
      DOMAIN: apps.silver.devops.gov.bc.ca
      PREFIX: ${{ github.event.repository.name }}-${{ github.event.number }}
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    timeout-minutes: 1
    steps:
      - uses: bcgov/action-pr-description-add@d79a5c3b49d3b3b3215495afac3ae599cef191bb #v2.0.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          add_markdown: |
            ---

            Thanks for the PR!

            After merge, new images are deployed and promoted to DEV:
            - [DEV Homepage](https://limesurvey-dev.${{ env.DOMAIN }})


  # Get PR number for merge queues, otherwise jusr use github.event.nuber
  vars:
    name: Set Variables
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
      branch_tag: ${{ steps.tags.outputs.branch_tag }}
      sha_tag: ${{ steps.tags.outputs.sha_tag }}
    runs-on: ubuntu-24.04
    steps:
      - name: PR Number
        id: pr
        uses: bcgov/action-get-pr@28b0adf8e4d40720d41f9c87356ce24b0a4bd6af #v0.3.1
      - name: Image Tags
        id: tags
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          branch=$(echo "$HEAD_REF" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^-+//; s/-+$//; s/-+/-/g' | cut -c1-100)
          if [ -z "$branch" ]; then
            branch="pr-${{ steps.pr.outputs.pr }}"
          fi
          echo "branch_tag=branch-$branch" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"

  # https://github.com/bcgov/action-builder-ghcr
  builds:
    name: Builds
    needs: [vars]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        package: [php, nginx]
    timeout-minutes: 10
    steps:
      - uses: bcgov/actions/builder-ghcr@0992e41cd11c5370b77f9e6066effe63efe9f8c9 #v0.4.0
        with:
          package: 'limesurvey-${{ matrix.package }}'
          build_context: ${{ matrix.package }}
          build_file: '${{ matrix.package }}/Dockerfile'
          tags: |
            pr-${{ needs.vars.outputs.pr }}
            ${{ needs.vars.outputs.branch_tag }}
            ${{ needs.vars.outputs.sha_tag }}
          tag_fallback: dev
          triggers: ('${{ matrix.package }}/') #omit to build everything

  trivy-images:
    name: Scan Published Images
    needs: [vars, builds]
    uses: ./.github/workflows/analysis.yml
    permissions:
      packages: read
      security-events: write
    with:
      image_tag: ${{ needs.vars.outputs.sha_tag }}
