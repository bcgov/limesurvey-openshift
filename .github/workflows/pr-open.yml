name: Build - PR Open
run-name: "Build (PR #${{ github.event.pull_request.number }})"

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  # Cancel in progress for PR open and close, but not merge_group
  group: ${{ github.event.number }}
  cancel-in-progress: true

jobs:
  pr-description-add:
    name: PR Description Add
    if: github.event_name == 'pull_request'
    env:
      DOMAIN: apps.silver.devops.gov.bc.ca
      PREFIX: ${{ github.event.repository.name }}-${{ github.event.number }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    timeout-minutes: 1
    steps:
      - uses: bcgov/action-pr-description-add@d79a5c3b49d3b3b3215495afac3ae599cef191bb #v2.0.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          add_markdown: |
            ---

            Thanks for the PR!

            PR images are available as `pr-${{ github.event.pull_request.number }}` for manual deployment.


  # https://github.com/bcgov/action-builder-ghcr
  builds:
    name: Builds
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        package: [php, nginx]
    timeout-minutes: 10
    steps:
      - uses: bcgov/actions/builder@ac9d89eede94f5f58d3446784c94cff634d98eac #v0.6.0
        with:
          package: 'limesurvey-${{ matrix.package }}'
          build_context: ${{ matrix.package }}
          build_file: '${{ matrix.package }}/Dockerfile'
          sbom: 'false'
          tags: pr-${{ github.event.pull_request.number }}

  trivy-images:
    name: Scan Published Images
    needs: [builds]
    uses: ./.github/workflows/analysis.yml
    permissions:
      packages: read
      security-events: write
    with:
      image_tag: pr-${{ github.event.pull_request.number }}
